<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Detalhes do jogo — LifeBar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="lang-toggle" id="lang-toggle" href="en/game.html" aria-label="Switch to English">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    EN
  </a>
  <header class="app-header">
    <h1 class="brand">
      <img class="pixel-wordmark" src="assets/lifebar-logo.svg" width="248" height="44" alt="LifeBar">
    </h1>
    <span class="platform-tag">Mega Drive</span>
    <p class="subtitle"><a href="index.html">&larr; Voltar ao catálogo</a></p>
  </header>

  <main>
    <section id="game-detail" class="game-detail hidden">
      <div class="game-detail-cover">
        <img id="detail-boxart" class="detail-boxart" alt="">
      </div>
      <div class="game-detail-info">
        <h2 id="detail-title" class="game-detail-title"></h2>
        <div class="detail-toggles">
          <button type="button" id="detail-played-btn" class="played-btn detail-played-btn" title="Não jogado" aria-label="Não jogado">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle class="ring" cx="12" cy="12" r="9"/><path class="check-1" d="M7.5 12.5l3 3 6-6.5"/><path class="check-2" d="M11.5 12.5l3 3 6-6.5"/></svg>
          </button>
          <button type="button" id="detail-favorite-btn" class="favorite-btn" aria-pressed="false" title="Favorito" aria-label="Favorito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
        <dl class="game-detail-meta" id="detail-meta"></dl>
        <p id="detail-summary" class="game-detail-summary"></p>
      </div>
    </section>

    <p id="detail-not-found" class="empty-state hidden">Jogo não encontrado. <a href="index.html">Voltar ao catálogo</a>.</p>
  </main>

  <footer class="app-footer">
    <p><a href="index.html">Voltar ao catálogo</a></p>
  </footer>

  <script src="common.js"></script>
  <script src="game.js"></script>
</body>
</html>
